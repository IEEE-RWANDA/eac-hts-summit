name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Next.js app
        id: app
        run: |
          if [ ! -f package.json ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deployment skipped: add a Next.js app at the repository root." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node -e 'const p = require("./package.json"); if (!p.dependencies?.next && !p.devDependencies?.next) throw new Error("Expected a Next.js app at the repository root");'
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.app.outputs.ready == 'true'
        with:
          node-version: 24
      - run: npm install --global vercel@56.5.0
        if: steps.app.outputs.ready == 'true'
      - name: Deploy
        if: steps.app.outputs.ready == 'true'
        env:
          PRODUCTION: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        run: |
          args=(--yes --token="$VERCEL_TOKEN")
          if [ "$PRODUCTION" = "true" ]; then
            args+=(--prod)
          fi
          url=$(vercel deploy "${args[@]}")
          printf 'Deployed: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
